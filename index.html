<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, user-scalable=no">
  <title>碎界 Shatter Realm</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #141217; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #141217; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
               color: #e8e2da; font: 600 22px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; gap: 18px; }
    #bar { width: 320px; height: 14px; background: #2b272f; border-radius: 7px; overflow: hidden; }
    #fill { width: 0; height: 100%; background: #50aaff; transition: width .2s; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><div>碎界 · 加载中</div><div id="bar"><div id="fill"></div></div></div>
  <script src="Build/WebGL.loader.js"></script>
  <script>
    var canvas = document.getElementById("unity-canvas");
    createUnityInstance(canvas, {
      dataUrl: "Build/WebGL.data.unityweb",
      frameworkUrl: "Build/WebGL.framework.js.unityweb",
      codeUrl: "Build/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "ShatterRealm",
      productName: "碎界 Shatter Realm",
      productVersion: "1.0",
    }, function (p) {
      document.getElementById("fill").style.width = (p * 100) + "%";
    }).then(function () {
      document.getElementById("loading").remove();
      canvas.focus();
    }).catch(function (e) {
      document.getElementById("loading").textContent = "加载失败：" + e;
    });
    canvas.addEventListener("pointerdown", function () { canvas.focus(); });
    canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  </script>
</body>
</html>
