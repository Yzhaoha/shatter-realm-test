<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>碎界 · 悬梁哨塔试玩</title><style>*{box-sizing:border-box}body{margin:0;background:#bfebfd;font:700 16px system-ui;color:#223550}canvas{width:100vw;height:100dvh;display:block;touch-action:none}header,footer{position:fixed;left:4%;right:4%;display:flex;align-items:center;gap:10px;pointer-events:none}header{top:4%;justify-content:space-between}footer{bottom:5%}b,button{background:#fffcf4;border:2px solid #334259;border-radius:12px;padding:8px 13px;box-shadow:0 3px #334259}button{pointer-events:auto;cursor:pointer;font:inherit;color:inherit}small{display:block;font-size:11px;color:#637181}progress{width:100%;height:5px;display:block;accent-color:#ff9b36}#hint{position:fixed;top:16%;text-align:center;width:100%;pointer-events:none;text-shadow:0 1px white}</style><canvas></canvas><header><b><small>碎界 · 网页原型</small>悬梁哨塔</b><b id="left"></b><button onclick="reset()">重试</button></header><div id="hint"></div><footer><b id="ammo"></b></footer><script>
const cv=document.querySelector('canvas'),g=cv.getContext('2d'),hint=document.querySelector('#hint');
let pieces,shots,count,ended,s,ox,oy,last=0,angle=-1;
const floor=367,edge=550;
function reset(){pieces=[];shots=[];count=7;ended=false;function block(x,y,w,h,color,kind){pieces.push({x,y,w,h,color,kind,vx:0,vy:0,a:0,spin:0,moving:false})}
block(460,332,28,70,'#45cde5','crystal');block(460,288,142,18,'#c78a44','deck');block(420,260,18,38,'#b87538','post');block(500,260,18,38,'#b87538','post');block(460,233,115,16,'#e0a551','roof');block(460,210,32,30,'#8bbe55','sprout');hint.textContent='点蓝色水晶柱，试试一炮拆掉支撑';hud()}
function hud(){ammo.textContent='● × '+count;left.innerHTML='还剩 '+pieces.length+' 件<progress max="6" value="'+(6-pieces.length)+'"></progress>'}
function resize(){let w=innerWidth,h=cv.clientHeight,d=Math.min(2,devicePixelRatio);cv.width=w*d;cv.height=h*d;s=Math.min(w/660,h/490);ox=(w-660*s)/2;oy=(h-490*s)/2;g.setTransform(d*s,0,0,d*s,d*ox,d*oy)}
onresize=resize;resize();reset();
cv.onpointerdown=e=>{if(ended||!count||shots.length)return;let x=(e.clientX-ox)/s,y=(e.clientY-oy)/s; angle=Math.atan2(y-360,x-105);shots.push({x:105,y:360,endX:x,endY:y,t:0});count--;hint.textContent='';hud()}
function push(p,v){p.moving=true;p.vx=v;p.vy=-90;p.spin=v/400}
function impact(x,y){let p=pieces.find(p=>Math.abs(x-p.x)<=p.w/2+8&&Math.abs(y-p.y)<=p.h/2+8);if(!p)return;if(p.kind==='crystal'){pieces.splice(pieces.indexOf(p),1);pieces.forEach((b,i)=>push(b,45+i*12));hint.textContent='支撑碎了！把余下的积木推出岛边'}else push(p,240);hud()}
function box(x,y,w,h,color,a=0){g.save();g.translate(x,y);g.rotate(a);g.fillStyle=color;g.fillRect(-w/2,-h/2,w,h);g.fillStyle='#ffffff44';g.fillRect(-w/2,-h/2,w,4);g.fillStyle='#17283833';g.fillRect(w/2-5,-h/2,5,h);g.restore()}
function frame(now){let dt=Math.min(.035,(now-last)/1000);last=now;let W=innerWidth/s,H=cv.clientHeight/s,X=-ox/s,Y=-oy/s;let bg=g.createLinearGradient(0,Y,0,Y+H);bg.addColorStop(0,'#8bc9f7');bg.addColorStop(.7,'#e4f8ff');bg.addColorStop(.701,'#85dfec');bg.addColorStop(1,'#4fbecf');g.fillStyle=bg;g.fillRect(X,Y,W,H);
for(let [x,y,w] of [[68,155,75],[562,122,52],[345,367,205],[55,385,110]]){box(x+w/2,y+20,w,40,'#d8a76b');box(x+w/2,y+44,w*.68,20,'#b99469');box(x+w/2,y+60,w*.35,16,'#8c909b');box(x+w/2,y+4,w,8,'#9bc954')}
for(let b of pieces){if(b.moving){b.vy+=480*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.a+=b.spin*dt;if(b.x<edge&&b.x>345&&b.y+b.h/2>floor&&b.vy>0){b.y=floor-b.h/2;b.vy=0;b.vx*=Math.exp(-2.5*dt);b.spin=b.vx/400}}box(b.x,b.y,b.w,b.h,b.color,b.a);if(b.kind==='sprout'){g.fillStyle='#25352e';g.fillRect(b.x-7,b.y-3,3,4);g.fillRect(b.x+4,b.y-3,3,4)}}
let leftBefore=pieces.length;pieces=pieces.filter(p=>p.y<570);if(leftBefore!==pieces.length)hud();
box(102,373,44,24,'#334862');g.save();g.translate(105,360);g.rotate(angle);box(17,0,56,19,'#316a96');box(42,0,8,24,'#e7b54f');g.restore();
if(shots.length){let q=shots[0];q.t=Math.min(1,q.t+dt*2.8);let x=105+(q.endX-105)*q.t,y=360+(q.endY-360)*q.t-55*Math.sin(Math.PI*q.t);g.fillStyle='#263c55';g.beginPath();g.arc(x,y,7,0,7);g.fill();if(q.t===1){impact(q.endX,q.endY);shots=[]}}
if(!ended&&!shots.length&&(!pieces.length||(!count&&!pieces.some(p=>p.moving&&(Math.abs(p.vx)>2||Math.abs(p.vy)>2))))){ended=true;hint.textContent=pieces.length?'弹药用完了 · 点重试再来一次':'清岛成功！ · 剩余 '+count+' 发'}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
